name: XINCODE CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018'

      # codegraph 内核是 Rust + tree-sitter,要交叉编译成 arm64 的 .so 才能打进 APK。
      # 产物不进 git(34MB,每次重编都是新 blob),所以每次构建都在这里现编。
      - name: Setup Rust for Android
        run: |
          rustup target add aarch64-linux-android
      - name: Build codegraph kernel (arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x codegraph-kernel/build-android.sh
          ./codegraph-kernel/build-android.sh

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codegraph-kernel/target
          key: rust-${{ hashFiles('codegraph-kernel/Cargo.lock') }}
          restore-keys: rust-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant gradlew execute
        run: chmod +x gradlew

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xincode-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release:
    # 注意:GitHub Actions 的 == 是【字符串精确相等】,不支持通配符——
    # 写成 github.ref == 'refs/tags/v*' 永远为 false,打了 tag 也不会跑这个 job。
    # 必须用 startsWith 做前缀匹配。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # action-gh-release 要往 Release 上传资产,需要写权限(默认 GITHUB_TOKEN 可能是只读)。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018'

      # codegraph 内核是 Rust + tree-sitter,要交叉编译成 arm64 的 .so 才能打进 APK。
      # 产物不进 git(34MB,每次重编都是新 blob),所以每次构建都在这里现编。
      - name: Setup Rust for Android
        run: |
          rustup target add aarch64-linux-android
      - name: Build codegraph kernel (arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x codegraph-kernel/build-android.sh
          ./codegraph-kernel/build-android.sh

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > xincode-release.jks
          echo "storeFile=xincode-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=xincode" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      # 下次发版零手工:从 CHANGELOG 截取本 tag 对应段落做 Release notes。
      # tag 形如 v1.14.0,CHANGELOG 段头形如 "## [1.14.0] - 日期",去 v 匹配前缀。
      # 截不到(忘写 CHANGELOG)则给一行兜底,不空着发。
      - name: Extract release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 {flag=1; next}
            /^## \[/ {if (flag) exit}
            flag
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "更新说明见仓库 CHANGELOG 全文。" > release-notes.md
          fi
          printf '\n> 正式签名版 APK 已自动附带.\n' >> release-notes.md
          head -n 5 release-notes.md

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xincode-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}